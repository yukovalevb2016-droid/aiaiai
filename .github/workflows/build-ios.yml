name: Build iOS app

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        id: build
        continue-on-error: true
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project VoiceMemoAI/VoiceMemoAI.xcodeproj \
            -scheme "Слушай" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Build.xcresult \
            -showBuildTimingSummary \
            -parallelizeTargets \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Export build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p build/artifacts
          if [ -d build/Build.xcresult ]; then
            xcrun xcresulttool get log --path build/Build.xcresult --type console \
              > build/artifacts/xcodebuild-diagnostics.txt || true
          fi
          if [ ! -s build/artifacts/xcodebuild-diagnostics.txt ]; then
            cp build/xcodebuild.log build/artifacts/xcodebuild-diagnostics.txt
          fi

      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: build/artifacts/xcodebuild-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when Xcode build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package app
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "build/DerivedData/Build/Products/Release-iphoneos/Слушай.app" \
            "build/artifacts/Слушай-unsigned.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/artifacts/Слушай-unsigned.zip
          if-no-files-found: error
          retention-days: 14
